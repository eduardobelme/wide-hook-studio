<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Wide Hook Studio</title>
<!--
  Wide Hook Studio (live). One self-contained page: it holds no data and no keys.
  When you open it, you sign in with Google and it reads your content notes straight from
  Google Drive (My Drive > CONFIG.rootFolder > CONFIG.contentFolder), in your browser, with your own access.
  It writes only: an idea's or draft's `status:` line, `approved:` on a draft you approve, a piece's
  `awareness:` step, and new idea notes. It never moves, renames or deletes a note, and never
  changes the text below a note's properties. Test it without touching real notes: dev/mock_drive.py.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6b5a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f5c400' font-family='Arial Black,Arial' font-weight='900'%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#f5f7f6; --ink:#13201b; --ink-2:#38463f; --muted:#5f6e68;
  --line:#d3dbd7; --line-2:#e4e9e6;
  --accent:#0f6b5a; --accent-hover:#0b5547; --on-accent:#ffffff; --accent-soft:#dcefe8; --accent-text:#0d5f50;
  --marker:#f5c400; --on-marker:#1b1600;
  --good:#1f7a3d; --good-soft:#e3f3e7; --warn:#8a5a00; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe9e7;
  --s1:#083f35; --s2:#0e5a4c; --s3:#157564; --s4:#1f907c; --s5:#3aa58f; --s6:#5ab6a0; --s7:#2b5c8a;
  --on-s1:#fff; --on-s2:#fff; --on-s3:#fff; --on-s4:#fff; --on-s5:#0b1311; --on-s6:#0b1311; --on-s7:#fff;
  --shadow:0 1px 2px rgb(16 32 28 / .06),0 6px 20px rgb(16 32 28 / .07);
  --scrim:rgb(10 18 15 / .5);
  --f-display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --surface:#151d1a; --surface-2:#1a2420; --ink:#e4ebe8; --ink-2:#c0ccc7; --muted:#8e9d97;
    --line:#2b3733; --line-2:#222d29;
    --accent:#4fc4a6; --accent-hover:#6dd3b9; --on-accent:#06201a; --accent-soft:#17332b; --accent-text:#6dd3b9;
    --good:#7bd88f; --good-soft:#15301d; --warn:#f0b54a; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1714;
    --s1:#9fe5d2; --s2:#74d1ba; --s3:#4fbca2; --s4:#2f9e86; --s5:#1f806c; --s6:#176757; --s7:#93bde6;
    --on-s1:#0b1311; --on-s2:#0b1311; --on-s3:#0b1311; --on-s4:#0b1311; --on-s5:#fff; --on-s6:#fff; --on-s7:#0b1311;
    --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 20px rgb(0 0 0 / .25); --scrim:rgb(0 0 0 / .62);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3,h4{margin:0;text-wrap:balance} p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)} .muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.xs{font-size:12px;padding:4px 8px;border-radius:6px}
.btn.big{font-size:16px;padding:11px 20px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select,input[type="text"],input[type="search"],textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px;font-size:13.5px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.45}
@media (max-width:640px){select,input[type="text"],input[type="search"],textarea{font-size:16px}}
.banner{max-width:1440px;margin:0 auto 12px;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.banner.test{background:var(--marker);color:var(--on-marker)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}

/* shell */
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--f-display);font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.brand span{background:var(--marker);color:var(--on-marker);padding:0 .12em}
.brand.big{font-size:42px}
.lanes{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lane{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.lane b{font-size:13.5px}
.lane .mono{font-size:11px;color:var(--muted)}
.lane[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lane[aria-pressed="true"] .mono{color:var(--bg);opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.navgroup{font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.navbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;border-radius:7px;padding:7px 9px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);text-align:left;white-space:nowrap}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.navbtn .n{font:500 11px/1 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);padding:3px 6px;border-radius:999px;color:var(--ink-2)}
.navbtn .n.hot{background:var(--marker);border-color:var(--marker);color:var(--on-marker)}
.sync{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line-2);padding-top:10px}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;gap:10px}
  .lanes{flex-direction:row;flex-wrap:wrap}
  .lane{width:auto;flex:1 1 auto}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .navgroup{display:none}
}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.mhead h1{font-size:26px;line-height:1.1;font-weight:700}
.mhead p{color:var(--muted);font-size:13.5px;max-width:80ch;margin-top:4px}
.persp{font:500 11.5px/1 var(--f-mono);letter-spacing:.04em;padding:6px 9px;border-radius:999px;background:var(--ink);color:var(--bg)}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.kpi{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.kpi:hover{border-color:var(--muted)}
.kpi .big{font-family:var(--f-display);font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.li:first-child{border-top:0}
.li .lt{min-width:0;flex:1 1 260px}
.li .t{display:block;border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:13.5px;line-height:1.3;cursor:pointer;color:var(--ink)}
.li .t:hover{text-decoration:underline}
.li .m{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.acts{justify-content:flex-end}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.more{border:0;background:none;color:var(--accent-text);cursor:pointer;padding:8px 0;font-size:13px;text-align:left}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tablewrap{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line-2);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.t th button{all:unset;cursor:pointer}
table.t td.num,table.t th.num{text-align:right}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--f-mono);padding:4px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.chip.code{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.st{font:600 10.5px/1 var(--f-mono);letter-spacing:.03em;padding:4px 7px;border-radius:5px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st.g-pack{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.st.g-script,.st.g-prod{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st.g-pub{background:var(--good-soft);color:var(--good);border-color:transparent}
.st.g-shelf{opacity:.7}
.step{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap}
.step.s1{background:var(--s1);color:var(--on-s1)}.step.s2{background:var(--s2);color:var(--on-s2)}.step.s3{background:var(--s3);color:var(--on-s3)}
.step.s4{background:var(--s4);color:var(--on-s4)}.step.s5{background:var(--s5);color:var(--on-s5)}.step.s6{background:var(--s6);color:var(--on-s6)}.step.s7{background:var(--s7);color:var(--on-s7)}
.who{font:500 11px/1.3 var(--f-mono);color:var(--muted)}
.flag{display:inline-block;font:600 12px/1.4 var(--f-body);padding:6px 9px;border-radius:6px;background:var(--bad-soft);color:var(--bad)}

/* pipeline */
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;align-items:start}
@media (max-width:640px){.board{grid-template-columns:minmax(0,1fr);overflow:visible}}
.col{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:12.5px;display:flex;justify-content:space-between;padding:2px 4px}
.col h3 .n{font:500 11.5px/1 var(--f-mono);color:var(--muted)}
.col .sub{font:500 10px/1.3 var(--f-mono);color:var(--muted);padding:0 4px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.pc:hover{border-color:var(--muted)}
.pc .pt{font-weight:600;font-size:13px;line-height:1.3}
.pc .pm{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pc .from{font:500 10.5px/1.2 var(--f-mono);color:var(--muted)}

/* calendar */
.agenda{display:flex;flex-direction:column;gap:12px}
.day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;border-top:1px solid var(--line-2);padding-top:10px}
.day:first-child{border-top:0;padding-top:0}
.day .dl{font:600 12px/1.4 var(--f-mono);color:var(--ink-2)}
.day.today .dl{color:var(--accent-text)}
@media (max-width:560px){.day{grid-template-columns:minmax(0,1fr)}}

/* journey */
.jt{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.jt th{font:500 10.5px/1.25 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;vertical-align:bottom}
.jt td{padding:0}
.bandrow td{padding:10px 6px 0}
.bandrow span{font:600 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cell{width:100%;min-height:44px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;padding:6px 9px;cursor:pointer;text-align:left;color:var(--ink)}
.cell b{font-family:var(--f-display);font-size:19px;line-height:1;font-weight:400}
.cell.zero{background:var(--surface-2);border-style:dashed}
.cell.zero b{color:var(--muted)}
.cell[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-1px}
.cell:hover{border-color:var(--accent)}
.rowhead{padding:4px 6px 4px 0;min-width:130px}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field select,.field input,.field textarea{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
ol.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

/* drawer */
.drawer{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:flex-end}
.dpanel{background:var(--bg);width:min(1060px,100%);height:100%;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:-10px 0 40px rgb(0 0 0 / .25);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead h2{font-size:21px;line-height:1.25;margin-top:6px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:880px){.dgrid{grid-template-columns:minmax(0,1fr)}.dside{order:-1}}
details.card summary{cursor:pointer}
.dside{display:flex;flex-direction:column;gap:14px}
.props{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr);gap:4px 10px;font-size:12.5px}
.props dt{font-family:var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.props dd{margin:0;overflow-wrap:anywhere}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metrics div{background:var(--surface-2);border-radius:7px;padding:6px 8px}
.metrics b{display:block;font-family:var(--f-display);font-size:20px;font-weight:400;line-height:1.1}
.metrics span{font:500 10.5px/1.2 var(--f-mono);color:var(--muted)}

/* note body */
.mdbody{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.mdbody>*+*{margin-top:10px}
.mdbody .mdh{line-height:1.3}
.mdbody h2.mdh{font-size:17px}.mdbody h3.mdh{font-size:15px}.mdbody h4.mdh,.mdbody h5.mdh,.mdbody h6.mdh{font-size:14px}
.mdbody ul,.mdbody ol{padding-left:22px;margin:0}
.mdbody li.cb{list-style:none;margin-left:-18px}
.mdbody blockquote{margin:0;border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink-2)}
.mdbody code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.mdbody pre.code{font:12px/1.5 var(--f-mono);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.mdbody hr{border:0;border-top:1px solid var(--line)}
.mdbody mark{background:var(--marker);color:var(--on-marker)}
.wl{color:var(--accent-text);font-weight:500}
table.md{font-size:12.5px}

/* sign-in, loading, toast */
.signin{max-width:520px;margin:12vh auto 0;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.signin p{font-size:16px;color:var(--ink-2)}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);vertical-align:-2px}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.dpanel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:999px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
/* ---- screens ported from the prototype (23 Nov 2026) ---- */
:root{--board:#1b2925;--on-board:#e8efeb;--on-board-2:#a9bbb4;--chalk:#f5c400;--paid:#5b3fa8;--paid-soft:#ece7f8}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.mhead .persp{display:inline-block;margin-bottom:6px}
.cell{gap:8px}
.cell span{font-size:11.5px;color:var(--muted);line-height:1.2}
.cell.paid{border-color:var(--paid)}
.chip.paid{border-color:transparent;background:var(--paid-soft);color:var(--paid)}

};
const FMT_CH = { "Long video":"YouTube", Short:"YouTube Shorts", Video:"TikTok", Reel:"Instagram", Episode:"Podcast", Carousel:"Instagram", Email:"Newsletter", Thread:"X / Threads", Ad:"Meta Ads", "Live workshop":"Skool", Page:"Web", Resource:"Skool" };
const LANE_SKIP = { AI:["Long video", "Short", "Thread"], PB:["Video", "Ad", "Live workshop", "Resource", "Email"] };

const CH = { IG:"Instagram", FB:"Facebook", TT:"TikTok", SK:"Skool", YT:"YouTube", YS:"YouTube Shorts", LI:"LinkedIn", X:"X / Threads", NL:"Newsletter", EM:"Email", PC:"Podcast", WEB:"Web", AD:"Ads" };
const STAGE_OF = { "01 IDEAS":"ideas", "02 DRAFTS":"drafts", "03 READY TO POST":"ready", "04 POSTED":"posted" };
const METRICS = [
  ["views", /^(vistas|views|plays|reproducciones)/i, "Views"],
  ["reach", /^(alcance|reach)/i, "Reach"],
  ["impressions", /^(impresiones|impressions)/i, "Impressions"],

  ["members", /^(miembros nuevos)/i, "New members"],
];

/* ================= state ================= */
const S = {
  auth: "out", expired: false, authMsg: "", email: ls.get("whs.email") || "",
  lanes: [], noLaneId: null, notes: [], loadedAt: null, fromCache: false, loading: false, progress: "",
  lane: ls.get("whs.lane") || "all", view: "today", open: null, busy: false, undo: null,
  f: { it: "open", who: "", q: "", ch: "", step: "" }, brief: { step: "", fam: "", text: "" }, month: isoToday().slice(0, 7), jcell: null, sort: { key: "postedAt", dir: -1 },
};

/* ================= small helpers ================= */
function isoToday() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const dateOf = (v) => { const m = /(\d{4}-\d{2}-\d{2})/.exec(String(v || "")); return m ? m[1] : ""; };
const daysAgo = (d) => Math.round((new Date(isoToday()) - new Date(d)) / 864e5);
const fmtDate = (d) => { if (!d) return ""; const [y, m, dd] = d.split("-").map(Number); const s = new Date(y, m - 1, dd).toLocaleDateString("en-GB", { day:"numeric", month:"short" }); return y !== new Date().getFullYear() ? `${s} ${y}` : s; };
const fmtDay = (d) => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }); };
const fmtNum = (n) => n == null ? "—" : n >= 10000 ? `${(n / 1000).toFixed(n >= 100000 ? 0 : 1)}K` : n.toLocaleString("en-US");
const ago = (iso) => { const s = (Date.now() - new Date(iso)) / 1000; if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} h ago`; return fmtDate(dateOf(iso)); };
const stripMd = (s) => String(s).replace(/!?\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a).replace(/\*\*|__|`/g, "").replace(/(^|\s)\*(\S[^*]*?)\*/g, "$1$2").trim();
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const laneOf = (key) => S.lanes.find((l) => l.key === key);
const laneName = (key) => key === "none" ? "No lane" : (laneOf(key)?.name || "—");
const scope = () => S.lane === "all" ? S.notes : S.notes.filter((n) => n.lane === S.lane);
class AuthError extends Error {}

/* ================= notes: parsing ================= */
function splitFm(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(text);
  return m ? { fm: m[1], body: text.slice(m[0].length) } : { fm: "", body: text };
}
function unquote(v) {
  v = String(v).trim();
  if (v.length >= 2 && v[0] === '"' && v[v.length - 1] === '"') return v.slice(1, -1).replace(/\\(["\\])/g, "$1");
  if (v.length >= 2 && v[0] === "'" && v[v.length - 1] === "'") return v.slice(1, -1).replace(/''/g, "'");
  return v;
}
function parseFm(fm) {
  const out = {}; let cur = null;
  for (const line of fm.split(/\r?\n/)) {
    if (!line.trim() || /^\s*#/.test(line)) continue;
    const item = /^\s+-\s+(.*)$/.exec(line);
    if (item && cur) { if (!Array.isArray(out[cur])) out[cur] = out[cur] ? [out[cur]] : []; out[cur].push(unquote(item[1])); continue; }
    const kv = /^([^\s#-][^:]*?):(?:\s+(.*))?$/.exec(line);
    if (kv) {
      cur = kv[1].trim(); const v = (kv[2] || "").trim();
      out[cur] = v === "" ? "" : (v[0] === "[" && v[1] !== "[" && v[v.length - 1] === "]") ? v.slice(1, -1).split(",").map(unquote).filter(Boolean) : unquote(v);
    }
  }
  return out;
}
function chFromText(t) {
  t = String(t || "");
  if (/instagram|\breel/i.test(t)) return "IG"; if (/facebook/i.test(t)) return "FB"; if (/tiktok/i.test(t)) return "TT";
  if (/skool/i.test(t)) return "SK"; if (/youtube short|\bshorts?\b/i.test(t)) return "YS"; if (/youtube/i.test(t)) return "YT";
  if (/linkedin/i.test(t)) return "LI"; if (/threads|(^|\W)X(\W|$)/.test(t)) return "X"; if (/newsletter|email|correo/i.test(t)) return "NL";
  if (/podcast/i.test(t)) return "PC"; return "";
}
function num(s) {
  if (s == null) return null;
  const t = String(s).trim().replace(/^[~≈+]\s*/, "");
  const m = /^(\d{1,3}(?:[ ,.]\d{3})+|\d+(?:[.,]\d+)?)\s*(k|mil|m)?\b/i.exec(t);
  if (!m) return null;
  let a = m[1]; const mult = m[2] ? (/^m$/i.test(m[2]) ? 1e6 : 1e3) : 1;
  a = (!m[2] && /^\d{1,3}([ ,.]\d{3})+$/.test(a)) ? a.replace(/[ ,.]/g, "") : a.replace(",", ".");
  const n = parseFloat(a) * mult; return isFinite(n) ? Math.round(n) : null;
}
function cells(line) {
  let t = line.trim(); if (t.startsWith("|")) t = t.slice(1); if (t.endsWith("|") && !t.endsWith("\\|")) t = t.slice(0, -1);
  return t.split(/(?<!\\)\|/).map((c) => c.replace(/\\\|/g, "|").trim());
}
function parsePerf(body) {
  const i = body.search(/^##\s+(Performance|Rendimiento)\s*$/m); if (i < 0) return null;
  const rows = []; let started = false;
  for (const line of body.slice(i).split(/\r?\n/).slice(1)) {
    if (/^#{1,6}\s/.test(line)) break;
    if (/^\s*\|/.test(line)) { started = true; rows.push(cells(line)); } else if (started && line.trim()) break;
  }
  if (rows.length < 2) return null;
  const map = rows[0].map((h) => (METRICS.find(([, re]) => re.test(h.trim())) || [null])[0]);
  const data = rows.slice(1).filter((r) => !r.every((c) => /^:?-+:?$/.test(c)));
  let latest = null;
  for (const r of data) {
    const v = {}; let any = false;
    map.forEach((k, j) => { if (!k) return; const n = num(r[j]); if (n != null) { v[k] = (v[k] || 0) + n; any = true; } });
    if (any) latest = { label: stripMd(r[0] || ""), date: dateOf(r[1]), ...v };
  }
  return { latest, rows: data.length };
}
const parseCheckpoints = (v) => [...String(v || "").matchAll(/\b(D\d+)\s+(\d{4}-\d{2}-\d{2})/g)].map((m) => ({ label: m[1], date: m[2] }));
function parseNote(file, text) {
  const { fm, body } = splitFm(text); const p = parseFm(fm);
  const id = /^[A-Z]+-[A-Z]+-\d+$/.test(p.id || "") ? p.id : ((/^([A-Z]+-[A-Z]+-\d{3,})\b/.exec(file.name) || [])[1] || "");
  const h1 = (/^#\s+(.+)$/m.exec(body) || [])[1] || "";
  let title = h1 || file.name.replace(/\.md$/i, "").replace(/^\d{4}-\d{2}-\d{2}\s+—\s+/, "").replace(/^[A-Z]+-[A-Z]+-\d+\s+—\s+/, "");
  if (id) title = title.replace(new RegExp(`^${reEsc(id)}\\s*[·—:-]\\s*`), "");
  let status = String(p.status || "").trim().toLowerCase();
  if (file.stage === "posted") status = "posted"; else if (file.stage === "ready") status = "ready";
  else if (!(file.stage === "ideas" ? IDEA_ST : DRAFT_ST).includes(status)) status = "other";
  const aw = String(p.awareness || "").toLowerCase();
  return {
    fileId: file.id, file, name: file.name, path: file.path, lane: file.lane, stage: file.stage, who: file.who,
    id, title: stripMd(title) || file.name, status, statusRaw: Array.isArray(p.status) ? p.status.join(", ") : String(p.status || ""),
    ch: id ? id.split("-")[1] : chFromText(p.channel), channel: String(p.channel || ""), format: String(p.format || ""),
    hook: String(p.hook || ""), url: /^https?:\/\//.test(p.url || "") ? p.url : "",
    postedAt: dateOf(p.posted_at), scheduledAt: dateOf(p.scheduled_at), date: dateOf(p.date) || dateOf(file.name),
    approved: String(p.approved || ""), awareness: STEP[aw] ? aw : "", awStatus: String(p.awareness_status || ""),
    fm: p, body, perf: parsePerf(body), checkpoints: parseCheckpoints(p.checkpoints),
  };
}

/* ================= notes: writing (properties only) ================= */
function yamlScalar(v) {
  v = String(v);
  if (v === "" || /^[\s[\]{}&*!|>'"%@`,?:#-]/.test(v) || /: |\s#|\s$/.test(v)) return `"${v.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
  return v;
}
function setProps(text, changes) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?=\r?\n|$)/.exec(text);
  if (!m) throw new Error("This note has no properties block. Change it in Obsidian.");
  const nl = text.includes("\r\n") ? "\r\n" : "\n";
  const lines = m[1].split(/\r?\n/); const old = {};
  for (const [key, val] of Object.entries(changes)) {
    const re = new RegExp(`^${reEsc(key)}:(\\s|$)`);
    const idx = lines.findIndex((l) => re.test(l));
    let end = idx + 1; if (idx >= 0) while (end < lines.length && /^\s+\S/.test(lines[end])) end++;
    old[key] = idx >= 0 ? unquote(lines[idx].slice(key.length + 1)) : null;
    if (val == null) { if (idx >= 0) lines.splice(idx, end - idx); continue; }
    const line = `${key}: ${yamlScalar(val)}`;
    if (idx >= 0) lines.splice(idx, end - idx, line);
    else { const up = lines.findIndex((l) => /^up:(\s|$)/.test(l)); lines.splice(up >= 0 ? up : lines.length, 0, line); }
  }
  return { text: `---${nl}${lines.join(nl)}${nl}---${text.slice(m[0].length)}`, old };
}

/* ================= Google sign-in ================= */
let TOKEN = null, TOKEN_EXP = 0;
function restoreToken() {
  try { const t = JSON.parse(ss.get("whs.token") || "null"); if (t && t.exp > Date.now() + 60e3) { TOKEN = t.token; TOKEN_EXP = t.exp; return true; } } catch {}
  return false;
}
function keepToken(token, seconds) { TOKEN = token; TOKEN_EXP = Date.now() + (seconds - 120) * 1000; ss.set("whs.token", JSON.stringify({ token: TOKEN, exp: TOKEN_EXP })); }
function gisReady() {
  return new Promise((res, rej) => { const t0 = Date.now(); (function poll() {
    if (window.google?.accounts?.oauth2) return res();
    if (Date.now() - t0 > 12000) return rej(new Error("Google sign-in didn't load. Check the connection and reload the page."));
    setTimeout(poll, 100); })(); });
}
async function signIn() {
  if (MOCK_API) { keepToken("test-token", 3600); return; }
  if (!clientId()) throw new Error("This copy has no Google client ID yet.");
  await gisReady();
  await new Promise((resolve, reject) => {
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: clientId(), scope: CONFIG.scope, login_hint: S.email || undefined,
      callback: (r) => {
        if (!r || !r.access_token) return reject(new Error(r?.error_description || r?.error || "Sign-in was cancelled."));
        if (google.accounts.oauth2.hasGrantedAllScopes && !google.accounts.oauth2.hasGrantedAllScopes(r, CONFIG.scope)) return reject(new Error("The page needs access to your Google Drive. Sign in again and allow it."));
        keepToken(r.access_token, Number(r.expires_in || 3600)); resolve();
      },
      error_callback: (e) => reject(new Error(e?.type === "popup_closed" ? "The sign-in window was closed." : e?.type === "popup_failed_to_open" ? "The browser blocked the sign-in window. Allow pop-ups for this page." : "Sign-in failed.")),
    });
    tc.requestAccessToken({ prompt: "" });
  });
}

/* ================= Google Drive ================= */
async function api(path, opts = {}) {

const idb = (() => {
  let dbp = null; const mem = new Map(), memMeta = new Map();
  function open() {

    put(v) { mem.set(v.id, v); return tx("files", "readwrite", (s) => s.put(v)); },
    del(id) { mem.delete(id); return tx("files", "readwrite", (s) => s.delete(id)); },

    setMeta(k, v) { memMeta.set(k, v); return tx("meta", "readwrite", (s) => s.put(v, k)); },
    async clear() { mem.clear(); memMeta.clear(); await tx("files", "readwrite", (s) => s.clear()); await tx("meta", "readwrite", (s) => s.clear()); },

async function discover() {

  const content = await folderIn(root.id, CONFIG.contentFolder);
  if (!content) throw new Error(`There's no "${CONFIG.contentFolder}" folder inside ${CONFIG.rootFolder}.`);
  const base = `${CONFIG.contentFolder}/`, lanes = [], targets = [];
  for (const f of (await children(content.id)).filter(isFolder).sort((a, b) => a.name.localeCompare(b.name))) {
    if (/^00 IDEAS/i.test(f.name)) { targets.push({ id: f.id, lane: "none", stage: "ideas", who: "No lane", path: base + f.name }); continue; }
    if (!/^\d{2} /.test(f.name)) continue;

    await Promise.all(kids.filter(isFolder).map(async (k) => {
      const stage = STAGE_OF[k.name]; if (!stage) return;

      targets.push({ id: k.id, lane: lane.key, stage, who: "", path });
      if (stage !== "ideas") return;

    if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { const n = Math.min(6, m[1].length + 1); out.push(`<h${n} class="mdh">${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++])); out.push(mdTable(rows)); continue; }
    if (/^\s*>/.test(l)) { const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, "")); out.push(`<blockquote>${md(buf.join("\n").replace(/^\[!(\w+)\][+-]?\s*/, "**$1** "))}</blockquote>`); continue; }
    if (LIST.test(l)) {

        const cb = /^\[( |x|X)\]\s+/.exec(t);
        items.push(cb ? `<li class="cb">${cb[1].trim() ? "☑" : "☐"} ${inline(t.slice(cb[0].length))}</li>` : `<li>${inline(t)}</li>`);
      }
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`); continue;
    }

    const buf = [l]; i++;

  const stepSel = `<div class="field"><label for="d-step">Awareness step</label><div class="row"><select id="d-step"><option value="">No step yet</option>${STEPS.map((s) => `<option value="${s.key}" ${n.awareness === s.key ? "selected" : ""}>${s.n}. ${s.name}</option>`).join("")}</select><button class="btn xs" data-act="savestep" data-id="${esc(n.fileId)}">Save</button></div>${n.awareness && n.awStatus === "proposed" ? `<p class="small muted">Proposed by an agent. Saving confirms it.</p>` : ""}</div>`;
  const l = n.perf?.latest;
  const metrics = l ? `<section class="card"><h3>Latest reading${l.label ? `: ${esc(l.label)}` : ""}</h3><div class="metrics">${METRICS.filter(([k]) => l[k] != null).map(([k, , label]) => `<div><b>${fmtNum(l[k])}</b><span>${label}</span></div>`).join("")}</div>${l.date ? `<p class="small muted" style="margin-top:6px">Read ${fmtDate(l.date)}</p>` : ""}</section>` : "";
  const props = Object.entries(n.fm).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(Array.isArray(v) ? v.join(", ") : v).replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g, "$1") || "—"}</dd>`).join("");
  const body = n.body.replace(/^\s*#\s+.+\r?\n?/, "");
  const obs = `obsidian://open?vault=${encodeURIComponent(CONFIG.obsidianVault)}&file=${encodeURIComponent(n.path.replace(/\.md$/i, ""))}`;
  root.innerHTML = `<div class="drawer" data-act="closebg"><div class="dpanel" role="dialog" aria-modal="true" aria-label="${esc(n.title)}">
    <div class="dhead"><div style="min-width:0;flex:1 1 320px"><div class="row">${idChip(n)}${laneChip(n)}${chChip(n)}${stChip(n)}${stepChip(n)}</div><h2>${esc(n.title)}</h2><div class="who" style="margin-top:4px;overflow-wrap:anywhere">${esc(n.path)}</div></div>
      <div class="row"><a class="btn xs" href="https://drive.google.com/file/d/${encodeURIComponent(n.fileId)}/view" target="_blank" rel="noopener noreferrer">Open in Drive</a><a class="btn xs" href="${esc(obs)}">Open in Obsidian</a><button class="btn xs" data-act="close">Close</button></div></div>
    <div class="dgrid">
      <article class="card mdbody">${md(body) || empty("This note has no text yet.")}</article>
      <div class="dside">
        <section class="card form"><h3>Decide</h3>${decide}${stepSel}</section>
        ${metrics}
        <details class="card"><summary><b>Properties</b> <span class="who">${Object.keys(n.fm).length}</span></summary><dl class="props" style="margin-top:8px">${props}</dl></details>
      </div>
    </div></div></div>`;
}
let toastTimer = 0;
function toast(msg, opts = {}) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${opts.undo ? `<button class="btn xs" data-act="undo">Undo</button>` : ""}</div>`;
  S.undo = opts.undo || null; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; S.undo = null; }, opts.undo ? 12000 : 4000);
}

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, k = t.dataset.k;
  const note = t.dataset.id ? S.notes.find((n) => n.fileId === t.dataset.id) : null;
  switch (a) {
    case "signin": return guarded(async () => { await signIn(); S.auth = "in"; S.expired = false; S.authMsg = ""; render(); await whoami(); await showCache(); await loadAll(); });
    case "lane": S.lane = k; ls.set("whs.lane", k); S.f.ch = ""; S.f.who = ""; S.f.step = ""; S.jcell = null; return render();
    case "view": S.view = k; S.open = null; history.replaceState(null, "", `#${k}`); render(); return window.scrollTo({ top: 0 });
    case "open": S.open = t.dataset.id; return renderDrawer();
    case "close": S.open = null; return renderDrawer();
    case "closebg": if (e.target === t) { S.open = null; renderDrawer(); } return;
    case "status": return write(note, { status: t.dataset.to }, ST_NAME[t.dataset.to]);
    case "savestatus": { const v = document.getElementById("d-status")?.value; if (v) write(note, { status: v }, ST_NAME[v]); return; }
    case "approve": return write(note, { status: "approved", approved: `${isoToday()} (Eduardo, Wide Hook Studio)` }, "Approved to post");
    case "savestep": { const v = document.getElementById("d-step")?.value; return write(note, v ? { awareness: v, awareness_status: "confirmed" } : { awareness: null, awareness_status: null }, v ? `Step: ${STEP[v].name}` : "Step removed"); }
    case "refresh": return guarded(loadAll);
    case "signout": TOKEN = null; ss.del("whs.token"); S.auth = "out"; S.notes = []; S.lanes = []; S.loadedAt = null; S.open = null; S.authMsg = ""; return render();
    case "forget": return guarded(async () => {
      if (!confirm("Delete this browser's copy of your notes and sign out? Your notes in Drive are not touched.")) return;
      try { if (!MOCK_API && TOKEN && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(TOKEN, () => {}); } catch {}
      await idb.clear(); ["whs.lane", "whs.email", "whs.clientId"].forEach((x) => ls.del(x)); TOKEN = null; ss.del("whs.token");
      S.auth = "out"; S.notes = []; S.lanes = []; S.loadedAt = null; S.email = ""; S.lane = "all"; render(); toast("This device forgot your notes.");
    });
    case "month": { const [y, m] = S.month.split("-").map(Number); const d = new Date(y, m - 1 + Number(k), 1); S.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; return render(); }
    case "itab": S.f.it = k; return render();
    case "jcell": S.jcell = S.jcell === k ? null : k; return render();
    case "jcreate": { const [step, fam] = k.split("|"); S.brief = { step, fam: fam || "", text: "" }; S.view = "studio"; S.open = null; history.replaceState(null, "", "#studio"); render(); return window.scrollTo({ top: 0 }); }
    case "confirmstep": return note && note.awareness ? write(note, { awareness_status: "confirmed" }, `Step confirmed: ${STEP[note.awareness].name}`) : undefined;
    case "usefmt": { const c = document.getElementById("f-ch"), f = document.getElementById("f-format"); if (c) c.value = t.dataset.ch; if (f) f.value = t.dataset.f; return; }
    case "reuse": if (note) { S.brief = { step: note.awareness || "", fam: "", text: `Reuse this hook (from ${note.id || note.title}): ${stripMd(note.hook)}` }; S.view = "studio"; S.open = null; history.replaceState(null, "", "#studio"); render(); window.scrollTo({ top: 0 }); } return;
    case "sort": S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : (["title", "ch", "reading"].includes(k) ? 1 : -1) }; return render();
    case "undo": { const u = S.undo; S.undo = null; if (u) u(); return; }
  }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset?.in !== "q") return;
  S.f.q = e.target.value; const el = document.getElementById("idea-list"); if (el) el.innerHTML = ideaList();
});
document.addEventListener("change", (e) => {
  const k = e.target.dataset?.in; if (k === "who") { S.f.who = e.target.value; render(); } else if (k === "ch") { S.f.ch = e.target.value; render(); } else if (k === "step") { S.f.step = e.target.value; render(); }
  if (e.target.id === "f-step" || e.target.id === "f-lane") { const fit = document.getElementById("fit"); if (fit) fit.innerHTML = fitHtml(document.getElementById("f-step").value, document.getElementById("f-lane").value); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "client-form") {
    e.preventDefault(); const v = String(new FormData(e.target).get("cid") || "").trim();
    if (!/\.apps\.googleusercontent\.com$/.test(v)) return toast("That doesn't look like a Google client ID.");
    ls.set("whs.clientId", v); render(); return;
  }
  if (e.target.id !== "studio-form") return;
  e.preventDefault(); if (S.busy) return toast("Still saving…");
  const fd = new FormData(e.target); const get = (x) => String(fd.get(x) || "").trim();
  const f = { lane: get("lane"), title: get("title"), text: get("text"), step: get("step"), channel: get("channel"), format: get("format"), offer: get("offer"), approve: fd.get("approve") === "on" };
  if (!f.title) return toast("Give it a working title.");
  const form = e.target; S.busy = true; toast("Saving the idea…");
  guarded(async () => { try { const n = await createIdea(f); form.reset(); S.brief = { step: "", fam: "", text: "" }; S.open = n.fileId; render(); toast(`Saved: ${n.name}`); } finally { S.busy = false; } });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.open) { S.open = null; renderDrawer(); } });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.auth === "in" && !S.expired && !S.busy && S.loadedAt && Date.now() - new Date(S.loadedAt) > 5 * 60e3) guarded(loadAll);
});

/* ================= start ================= */
(async function boot() {
  const h = location.hash.slice(1); if (VIEWS[h]) S.view = h;
  if (restoreToken()) { S.auth = "in"; render(); await guarded(async () => { await showCache(); whoami().catch(() => {}); await loadAll(); }); }
  else render();
})();
})();
</script>
</body>
